name: CI

on:
  pull_request:
  push:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked development and benchmark dependencies
        run: make install
      - name: Lint, types, import contracts, and fast tests
        run: make check

  verify:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked development and benchmark dependencies
        run: make install
      - name: Full suite with branch coverage
        run: make cov
      - name: Verify generated artifacts
        run: make check-generated
      - name: Verify installed wheel outside the checkout
        run: make check-wheel
      - name: Drive the real CLI
        run: |
          make drive ARGS=all
          make drive ARGS=control
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-xml-${{ matrix.python-version }}
          path: coverage.xml

  container:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: make install
      - name: Build and verify the generated-code boundary on Linux amd64
        run: make check-container
