name: CI

on:
  pull_request:
  push:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install Python dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Lint (ruff format)
        run: uv run ruff format --check src tests

      - name: Mypy
        run: uv run mypy src/counterfact

      - name: Test with coverage
        run: uv run pytest -n auto --durations=20 --cov --cov-report=xml --cov-report=term-missing --cov-fail-under=80

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

      - name: Build wheel and verify bench/ excluded
        run: |
          uv build
          if unzip -l dist/*.whl | grep -E '^\s*[0-9]+\s+.*bench/'; then
              echo "ERROR: bench/ found in wheel"
              exit 1
          fi
          echo "wheel excludes bench/ ✓"
