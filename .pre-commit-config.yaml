# Install: make install && uv run --locked pre-commit install
# Run all hooks: uv run --locked pre-commit run --all-files

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff check from uv.lock
        entry: uv run --locked --extra dev --extra bench ruff check
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff format from uv.lock
        entry: uv run --locked --extra dev --extra bench ruff format
        language: system
        types_or: [python, pyi]
