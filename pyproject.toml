[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "counterfact"
version = "0.1.0"
description = "Causal attribution for agent traces with first-class identifiability labels."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [
    { name = "Adam Thuvesen", email = "adam.thuvesen@mentimeter.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pydantic>=2.14,<3",
    "polars>=2.0,<3",
    "numpy>=2.4,<3",
    "scikit-learn>=1.9,<2",
]

[project.optional-dependencies]
bench = [
    "litellm>=1.106,<2",
]
dev = [
    "pre-commit>=4.7",
    "pytest>=9.1,<10",
    "pytest-cov>=7.1,<8",
    "pytest-xdist>=3.8,<4",
    "ruff==0.17.4",
    "basedpyright==1.40.2",
    "ipykernel>=7,<8",
    "nbconvert>=7.17,<8",
    "hypothesis>=6,<7",
    "import-linter>=2,<3",
]

[project.urls]
Repository = "https://github.com/adamthuvesen/counterfact"
Issues = "https://github.com/adamthuvesen/counterfact/issues"

[project.scripts]
counterfact = "counterfact.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/counterfact"]

# Editable installs only: expose the bench harness on sys.path from the repo
# root so the locked development install keeps `counterfact bench` working.
# The built wheel still contains only `src/counterfact`.
[tool.hatch.build]
dev-mode-dirs = ["src", "."]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -ra --strict-markers -m 'not container'"
markers = [
    "container: real Docker execution boundary checks (run with make check-container)",
    "slow: subprocess or integration checks that run in make slow, not make check",
]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PGH003", "PTH", "RUF", "TID251"]
ignore = ["B008", "E501"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"counterfact.schema.Run.model_validate_json".msg = "Read run files with counterfact.corpus_io.load_run or load_corpus."
"counterfact.schema.models.Run.model_validate_json".msg = "Read run files with counterfact.corpus_io.load_run or load_corpus."
"subprocess".msg = "Process calls belong to their owner files; see [tool.ruff.lint.per-file-ignores]."
"pty".msg = "Process calls belong to their owner files; see [tool.ruff.lint.per-file-ignores]."
"asyncio.subprocess".msg = "Process calls belong to their owner files; see [tool.ruff.lint.per-file-ignores]."
"asyncio.create_subprocess_exec".msg = "Process calls belong to their owner files; see [tool.ruff.lint.per-file-ignores]."
"asyncio.create_subprocess_shell".msg = "Process calls belong to their owner files; see [tool.ruff.lint.per-file-ignores]."
"os.system".msg = "Process calls belong to their owner files; see [tool.ruff.lint.per-file-ignores]."
"os.popen".msg = "Process calls belong to their owner files; see [tool.ruff.lint.per-file-ignores]."
"os.posix_spawn".msg = "Process calls belong to their owner files; see [tool.ruff.lint.per-file-ignores]."
"os.posix_spawnp".msg = "Process calls belong to their owner files; see [tool.ruff.lint.per-file-ignores]."
"os.execl".msg = "Process calls belong to their owner files; see [tool.ruff.lint.per-file-ignores]."
"os.execle".msg = "Process calls belong to their owner files; see [tool.ruff.lint.per-file-ignores]."
"os.execlp".msg = "Process calls belong to their owner files; see [tool.ruff.lint.per-file-ignores]."
"os.execlpe".msg = "Process calls belong to their owner files; see [tool.ruff.lint.per-file-ignores]."
"os.execv".msg = "Process calls belong to their owner files; see [tool.ruff.lint.per-file-ignores]."
"os.execve".msg = "Process calls belong to their owner files; see [tool.ruff.lint.per-file-ignores]."
"os.execvp".msg = "Process calls belong to their owner files; see [tool.ruff.lint.per-file-ignores]."
"os.execvpe".msg = "Process calls belong to their owner files; see [tool.ruff.lint.per-file-ignores]."
"os.spawnl".msg = "Process calls belong to their owner files; see [tool.ruff.lint.per-file-ignores]."
"os.spawnle".msg = "Process calls belong to their owner files; see [tool.ruff.lint.per-file-ignores]."
"os.spawnlp".msg = "Process calls belong to their owner files; see [tool.ruff.lint.per-file-ignores]."
"os.spawnlpe".msg = "Process calls belong to their owner files; see [tool.ruff.lint.per-file-ignores]."
"os.spawnv".msg = "Process calls belong to their owner files; see [tool.ruff.lint.per-file-ignores]."
"os.spawnve".msg = "Process calls belong to their owner files; see [tool.ruff.lint.per-file-ignores]."
"os.spawnvp".msg = "Process calls belong to their owner files; see [tool.ruff.lint.per-file-ignores]."
"os.spawnvpe".msg = "Process calls belong to their owner files; see [tool.ruff.lint.per-file-ignores]."
"socket".msg = "Network clients have no owner in this repo."
"http.client".msg = "Network clients have no owner in this repo."
"urllib.request".msg = "Network clients have no owner in this repo."
"requests".msg = "Network clients have no owner in this repo."
"httpx".msg = "Network clients have no owner in this repo."
"litellm".msg = "Paid model calls go through bench/real/coding_agent/llm.py::LiteLLMClient."
"openai".msg = "Paid model calls go through bench/real/coding_agent/llm.py::LiteLLMClient."
"anthropic".msg = "Paid model calls go through bench/real/coding_agent/llm.py::LiteLLMClient."

[tool.ruff.lint.per-file-ignores]
"scripts/build_demo_notebook.py" = ["E501", "RUF001", "RUF002"]
# corpus_io owns run-file parsing. AnalysisCorpus re-parses its in-memory snapshots.
# Tests read published files directly to assert on the raw output.
"src/counterfact/corpus_io.py" = ["TID251"]
"src/counterfact/analysis/corpus.py" = ["TID251"]
# Owners of process calls and the paid model client. Tests also drive subprocesses and fake litellm.
"bench/real/coding_agent/executor.py" = ["TID251"]
"bench/real/coding_agent/fixtures.py" = ["TID251"]
"bench/real/coding_agent/llm.py" = ["TID251"]
"bench/real/container/verify.py" = ["TID251"]
"scripts/check_container.py" = ["TID251"]
"scripts/check_wheel.py" = ["TID251"]
"scripts/wheel_smoke.py" = ["TID251"]
".agents/skills/verify-counterfact/drives.py" = ["TID251"]
".agents/skills/verify-counterfact/verify" = ["TID251"]
"tests/**" = ["TID251"]

[tool.coverage.run]
source_pkgs = ["counterfact", "bench", "scripts"]
branch = true
parallel = true
patch = ["subprocess"]
relative_files = true
omit = ["*/bench/real/coding_agent/fixtures/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
include_namespace_packages = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.basedpyright]
include = ["src/counterfact", "bench", "scripts", "tests"]
exclude = ["bench/real/coding_agent/fixtures"]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
enableTypeIgnoreComments = false
reportUnnecessaryTypeIgnoreComment = "error"
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownParameterType = false
reportUnknownLambdaType = false
reportMissingTypeStubs = false

[[tool.basedpyright.executionEnvironments]]
root = "tests"
extraPaths = [".", "src"]
reportMissingParameterType = false
reportPrivateUsage = false

[tool.importlinter]
root_packages = ["counterfact", "bench"]

[[tool.importlinter.contracts]]
name = "Scientific code has no presentation or integration dependencies"
type = "forbidden"
source_modules = [
    "counterfact.analysis", "counterfact.attribute", "counterfact.baselines",
    "counterfact.dag", "counterfact.errors", "counterfact.intervene",
    "counterfact.outcome", "counterfact.policy", "counterfact.schema",
    "counterfact.stats", "counterfact.taxonomy", "counterfact.trace_localization",
]
forbidden_modules = [
    "counterfact.cli", "counterfact.adapters", "counterfact.tracing",
    "counterfact.explain", "counterfact.corpus_analyzer", "counterfact.ingest",
    "counterfact.runrecord_export", "bench",
]

[[tool.importlinter.contracts]]
name = "Presentation does not depend on CLI or provider integrations"
type = "forbidden"
source_modules = ["counterfact.explain", "counterfact.corpus_analyzer"]
forbidden_modules = ["counterfact.cli", "counterfact.adapters", "counterfact.tracing", "bench"]
