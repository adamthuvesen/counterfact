[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "counterfact"
version = "0.1.0"
description = "Causal attribution for agent traces with first-class identifiability labels."
readme = "README.md"
requires-python = ">=3.11"
authors = []
dependencies = [
    "pydantic>=2.7,<3",
    "polars>=1.0,<2",
    "numpy>=1.26,<3",
    "scipy>=1.13,<2",
    "scikit-learn>=1.5,<2",
    "litellm>=1.50,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "ruff>=0.5,<1",
    "jupyter>=1.0,<2",
    "nbconvert>=7.0,<8",
]

[project.scripts]
counterfact = "counterfact.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/counterfact", "bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"scripts/build_demo_notebook.py" = ["E501", "RUF001", "RUF002"]
