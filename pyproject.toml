[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "counter"
version = "0.0.0"
description = "Causal attribution for agent traces with first-class identifiability labels."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = []
dependencies = [
    "pydantic>=2.7,<3",
    "polars>=1.0,<2",
    "numpy>=1.26,<3",
    "scipy>=1.13,<2",
    "scikit-learn>=1.5,<2",
    "litellm>=1.50,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "ruff>=0.5,<1",
    "jupyter>=1.0,<2",
    "nbconvert>=7.0,<8",
]

[project.scripts]
counter = "counter.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/counter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["B008"]
