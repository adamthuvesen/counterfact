[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "counterfact"
version = "0.1.0"
description = "Causal attribution for agent traces with first-class identifiability labels."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "Adam Thuvesen", email = "adam.thuvesen@mentimeter.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pydantic>=2.14,<3",
    "polars>=2.0,<3",
    "numpy>=2.4,<3",
    "scikit-learn>=1.9,<2",
]

[project.optional-dependencies]
bench = [
    "litellm>=1.106,<2",
]
dev = [
    "pre-commit>=4.7",
    "pytest>=9.1,<10",
    "pytest-cov>=7.1,<8",
    "pytest-xdist>=3.8,<4",
    "ruff>=0.17.2,<0.18",
    "mypy>=2.4,<3",
    "jupyter>=1.1,<2",
    "nbconvert>=7.17,<8",
    "litellm>=1.106,<2",
]

[project.urls]
Repository = "https://github.com/adamthuvesen/counterfact"
Issues = "https://github.com/adamthuvesen/counterfact/issues"

[project.scripts]
counterfact = "counterfact.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/counterfact"]

# Editable installs only: expose the bench harness on sys.path from the repo
# root so `uv pip install -e ".[dev]"` keeps `counterfact bench` working.
# The built wheel still contains only `src/counterfact`.
[tool.hatch.build]
dev-mode-dirs = ["src", "."]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"scripts/build_demo_notebook.py" = ["E501", "RUF001", "RUF002"]

[tool.coverage.run]
source = ["src/counterfact"]
# Branch coverage is intentionally off: tests subprocess-invoke the
# `counterfact` CLI, which creates non-branch coverage files that conflict
# with branch data on combine. Statement coverage with the 80% gate is the
# meaningful signal.
branch = false
omit = ["bench/*", "tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.13"
files = ["src/counterfact"]
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
